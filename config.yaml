study: moving-dot
output: outputs
device: auto
modal:
  app: recon-jepa
  volume: recon-jepa
  concurrency: 5
protocol:
  seeds:
  - 3072
  - 3073
  - 3074
  rhos:
  - 1.0
  - 0.99
  - 0.9
  - 0.5
  - 0.0
  model:
    layers: 6
    width: 96
    patch: 4
    encoder_heads: 3
    encoder_mlp: 384
    predictor_layers: 2
    predictor_heads: 4
    head_dim: 24
    dropout: 0.1
  data:
    train: 20000
    validation: 2000
    test: 1024
    frames: 17
    generation_batch: 64
    image_size: 28
    dot_std: 1.3
    max_step: 4.0
    concentration: 0.2
    train_seed: 0
    validation_seed: 1
    train_noise_seed: 10000
    validation_noise_seed: 10001
    test_seed: 32452843
    test_noise_seed: 32452867
    sigma: 0.03
  training:
    steps: 5000
    batch_size: 128
    warmup: 50
    lr: 5.0e-05
    weight_decay: 0.001
    clip: 1.0
    checkpoint_every: 500
    precision: float32
    tf32: false
    compile: false
    lambda_sigreg: 0.09
  planning:
    seed: 9103
    trials: 100
    test_trials: 500
    horizon: 5
    budget: 20
    population: 128
    elites: 16
    iterations: 5
    success_radius: 1.5
    batch_size: 20
  probe:
    frames: 64000
    index_seed: 812
    ridge: 0.001
  sweep_beta:
  - 0.1
  - 1.0
  - 30.0
  - 300.0
  variants:
    blur: 7x7 Gaussian sigma1 pixel, reflect padding
    weighted: mean((.05+.95*clean_peak_scaled_image)*pixel_error_squared), no renormalization
    decay: beta=300*(5000-step)/4999 for updates1..5000
  criteria:
    main: blend beta300 minus plain >=20 percentage points at rho1 and rho.99 in EACH seed; absolute difference
      <=10 points at rho0 in EACH seed
    stage1: 'seed3072 validation: absolute frozen difference vs beta300 <=10 points AND absolute flicker
      difference vs plain <=3 points; highest flicker wins; tie blur,weighted,decay'
    stage2: selected variant on all five rho values x all three seeds; reuse its two completed Stage1
      models; no further selection
    motion_sanity: flag if frozen mean improvement over plain <10 points or any seed does not improve;
      report and review method; never tune
  figures:
    order:
    - 1.0
    - 0.99
    - 0.9
    - 0.5
    - 0.0
    hero: 'seed3072 frozen: rank all goals by mean final distance across plain and blend, select lower
      median, break ties by trajectory ID; no success filtering'
    background: first validation trajectory; same positions/actions across rho1,.99,0; noise contrast
      x4, explicitly labeled
    reconstruction: first six validation trajectories at frame0; identical limits[-.1,1] for input and
      beta1/beta300
    fps: 5
    png_scale: 2
  official:
    commit: b3c2fb374b7c69f169de15774f371290a8736f56
    weights:
      static: 0.25
      difference: 2.0
      inverse: 0.5
    adaptation: public train_step unchanged; independent compact six-layer diff encoder/projector; inverse
      MLP192-512-512-96 with LayerNorm/GELU; signed preprocessed differences; no target detach; no additional
      .09 SIGReg
